<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>California</title>
  <link rel="stylesheet" href="./css/index.css">
</head>
<body>
  <header class="header">
    <div class="header__container">
      <a href="#" class="header__logo" aria-label="На главную">
        <img src="icons/logo.svg" alt="California" class="header__logo-img">
      </a>
      <input type="checkbox" id="burger-toggle" class="header__burger-toggle">
      <nav class="header__nav nav">
        <ul class="nav__list">
          <li class="nav__item"><a href="#" class="nav__link">ALL PRODUCTS</a></li>
          <li class="nav__item">
            <a href="#" class="nav__link">SOLUTIONS</a>
            <img src="icons/arrow-down.svg" alt="Open submenu" class="nav__icon-dropdown">
          </li>
          <li class="nav__item"><a href="#" class="nav__link">ABOUT</a></li>
          <li class="nav__item"><a href="#" class="nav__link">SUPPORT</a></li>
        </ul>
      </nav>
      <div class="header__right">
        <div class="header__actions actions">
          <button type="button" class="actions__btn" aria-label="Поиск">
            <img src="icons/search.svg" alt="Search" class="actions__icon">
          </button>
          <button type="button" class="actions__btn" aria-label="Корзина">
            <img src="icons/cart.svg" alt="Cart" class="actions__icon">
          </button>
        </div>
        <label for="burger-toggle" class="header__burger" aria-label="Открыть меню">
          <span></span>
          <span></span>
          <span></span>
        </label>
      </div>
    </div>
  </header>
  <section class="hero">
    <div class="hero__container">
      <button class="hero__arrow hero__arrow--left" aria-label="Назад">
        <img src="icons/arrow-left.svg" alt="Назад">
      </button>
      <div class="hero__content">
        <h1 class="hero__title">The new phones are<br>here take a look.</h1>
        <p class="hero__desc">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Scelerisque in est dui, aliquam, tempor. Faucibus morbi turpis.</p>
        <button class="hero__btn">Explore</button>
      </div>
      <div class="hero__image">
        <img src="icons/hero-phones.svg" alt="Смартфоны">
      </div>
      <div class="hero__dots">
        <img src="icons/hero-dots.svg" alt="Пагинация" class="hero__dots-img">
      </div>
      <button class="hero__arrow hero__arrow--right" aria-label="Вперед">
        <img src="icons/arrow-right.svg" alt="Вперед">
      </button>
    </div>
  </section>
</body>
</html>
