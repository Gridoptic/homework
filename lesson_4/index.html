<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Формы</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <form class="form">
      <fieldset>
        <legend>Ваши личные данные</legend>
        <label>
          Ваше имя
          <input type="text" name="first-name" placeholder="Имя" required />
        </label>
        <label>
          <label>
            Ваш возраст
            <input type="number" name="age" inputmode="numeric" placeholder="Возраст" required />
          </label>
          Ваш номер телефона
          <input type="tel" inputmode="tel" name="phone" placeholder="Номер телефона" required />
        </label>
        <label>
          Ваша почта
          <input type="email" name="email" inputmode="email" placeholder="Почта" required />
        </label>
      </fieldset>
      <fieldset>
        <legend>Сообщение</legend>
        <textarea class="text" name="text" placeholder="Ваше сообщение" required></textarea>
        <label class="checkbox">
          <input type="checkbox" name="check" required />
          Я принимаю правила
        </label>
        <button type="submit">Отправить</button>
      </fieldset>
    </form>
  </body>
</html>
